<!doctype html>
<html lang="en-GB" data-collection="{{id}}" data-game="{{game}}">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets.tcgdex.net https://img.bindertracker.co.uk https://cards.lorcast.io; media-src 'self' blob:; connect-src 'self' https://assets.tcgdex.net https://img.bindertracker.co.uk; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{url}}">
  <meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Binder Tracker">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{imageAlt}}">
  <meta property="og:locale" content="en_GB">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{twitterDescription}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <meta name="twitter:image:alt" content="{{imageAlt}}">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Binder Tracker">
  <link rel="preload" href="fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script type="application/ld+json">{{{jsonLd}}}</script>
  <script src="js/shared/theme-init.js"></script>
  <script type="module" src="js/set/main.js"></script>
  <noscript><style>.page-loader { display: none; }</style></noscript>
</head>
<body class="set-page">
<div class="page-loader" id="page-loader" role="status">
  <svg class="page-loader__cog" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M10.27 4.09L10.68 1.08A11 11 0 0 1 13.32 1.08L13.73 4.09A8.1 8.1 0 0 1 16.37 5.18L18.79 3.35A11 11 0 0 1 20.65 5.21L18.82 7.63A8.1 8.1 0 0 1 19.91 10.27L22.92 10.68A11 11 0 0 1 22.92 13.32L19.91 13.73A8.1 8.1 0 0 1 18.82 16.37L20.65 18.79A11 11 0 0 1 18.79 20.65L16.37 18.82A8.1 8.1 0 0 1 13.73 19.91L13.32 22.92A11 11 0 0 1 10.68 22.92L10.27 19.91A8.1 8.1 0 0 1 7.63 18.82L5.21 20.65A11 11 0 0 1 3.35 18.79L5.18 16.37A8.1 8.1 0 0 1 4.09 13.73L1.08 13.32A11 11 0 0 1 1.08 10.68L4.09 10.27A8.1 8.1 0 0 1 5.18 7.63L3.35 5.21A11 11 0 0 1 5.21 3.35L7.63 5.18A8.1 8.1 0 0 1 10.27 4.09ZM15.4 12a3.4 3.4 0 1 0 -6.8 0a3.4 3.4 0 1 0 6.8 0Z"/></svg>
  <p class="page-loader__text">Loading {{name}}…</p>
</div>
{{{collectionBody}}}</body>
</html>
